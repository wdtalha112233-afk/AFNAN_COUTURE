<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFNAN COUTURE | Luxury Fashion</title><meta name="description" content="AFNAN COUTURE — luxury abayas, dresses and bridal couture. Cash on delivery.">
<style>
:root{--gold:#b08a45;--ink:#171512;--cream:#f7f2e9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:14px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font:22px Georgia,serif;letter-spacing:3px}.logo b{color:var(--gold)}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:6px;padding:10px 14px}.navbtn{background:none}.gold{background:var(--gold);color:white}.lang{border:1px solid var(--gold);background:white}.hero{padding:75px 6%;text-align:center;background:linear-gradient(#0008,#0008),url('https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=1800&q=85') center/cover;color:white}.hero h1{font:52px Georgia,serif;margin:10px}.hero p{font-size:18px}.wrap{max-width:1150px;margin:auto;padding:45px 20px}.section-title{text-align:center;font:32px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 5px 22px #0001}.card img{width:100%;height:300px;object-fit:cover}.card-body{padding:16px}.price{font-weight:bold;color:var(--gold);font-size:19px}.cartbar{position:fixed;right:18px;bottom:18px;z-index:20;background:#171512;color:white;padding:13px 18px;border-radius:30px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;padding:5vh 15px;overflow:auto}.box{background:white;max-width:720px;margin:auto;padding:25px;border-radius:12px}.close{float:right;background:#eee}.line{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;margin:6px 0 12px}.success{background:#eef8ee;padding:15px;border-radius:8px}.account{margin-top:15px;padding:15px;background:#fff;border-radius:10px}footer{background:#171512;color:white;text-align:center;padding:30px}[dir=rtl] body{text-align:right}[dir=rtl] .cartbar{right:auto;left:18px}[dir=rtl] .close{float:left}@media(max-width:650px){.hero h1{font-size:38px}.hide-mobile{display:none}}
</style></head><body>
<header><div class="logo">AFNAN <b>COUTURE</b></div><nav><button class="navbtn hide-mobile" onclick="filter('All')" data-i18n="all">All</button><button class="navbtn hide-mobile" onclick="filter('Abayas')" data-i18n="abayas">Abayas</button><button class="navbtn hide-mobile" onclick="filter('Dresses')" data-i18n="dresses">Dresses</button><button class="lang" onclick="toggleLang()" id="langBtn">العربية</button><button onclick="openAccount()" data-i18n="account">Account</button><button class="gold" onclick="openCart()">🛒 <span data-i18n="cart">Cart</span> <span id="count">0</span></button></nav></header>
<section class="hero"><h1>AFNAN COUTURE</h1><p data-i18n="hero">Luxury fashion with refined Sudanese-inspired elegance.</p><button class="gold" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})" data-i18n="shop">Shop Collection</button></section>
<main class="wrap" id="shop"><h2 class="section-title" data-i18n="featured">Featured Collection</h2><div class="grid" id="products"></div></main>
<footer>AFNAN COUTURE · Luxury Abayas · Dresses · Bridal Couture<br><small data-i18n="cod">Cash on Delivery available</small></footer>
<div class="cartbar" onclick="openCart()">🛒 <span id="bar">0</span> <span data-i18n="items">item(s)</span> · <span data-i18n="viewCart">View Cart</span></div>

<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeModal('cartModal')">✕</button><h2 data-i18n="yourCart">Your Cart</h2><div id="cartLines"></div><h3 id="total"></h3><hr><h3 data-i18n="checkout">Checkout — Cash on Delivery</h3><input class="field" id="name" data-ph="name" placeholder="Full name"><input class="field" id="phone" data-ph="phone" placeholder="Phone number"><textarea class="field" id="address" data-ph="address" placeholder="Delivery address"></textarea><input class="field" id="city" data-ph="city" placeholder="City / Country"><button class="gold" onclick="placeOrder()" data-i18n="confirm">Confirm Order</button><div id="result"></div></div></div>
<div class="modal" id="accountModal"><div class="box"><button class="close" onclick="closeModal('accountModal')">✕</button><div id="account"></div></div></div>

<script>
let products=[],cart=JSON.parse(localStorage.getItem('afnan_cart')||'[]'),lang=localStorage.getItem('afnan_lang')||'en',me=null;
const T={en:{all:"All",abayas:"Abayas",dresses:"Dresses",cart:"Cart",account:"Account",hero:"Luxury fashion with refined Sudanese-inspired elegance.",shop:"Shop Collection",featured:"Featured Collection",cod:"Cash on Delivery available",items:"item(s)",viewCart:"View Cart",yourCart:"Your Cart",checkout:"Checkout — Cash on Delivery",name:"Full name",phone:"Phone number",address:"Delivery address",city:"City / Country",confirm:"Confirm Order",empty:"Your cart is empty.",added:"Added to cart",complete:"Please complete your delivery details",login:"Login",register:"Create account",logout:"Logout",email:"Email",password:"Password",have:"Already have an account?",new:"New customer?",orders:"My Orders",loginFirst:"Login to manage your account and orders."},ar:{all:"الكل",abayas:"العبايات",dresses:"الفساتين",cart:"السلة",account:"حسابي",hero:"أزياء فاخرة بلمسة سودانية راقية.",shop:"تسوقي المجموعة",featured:"المجموعة المميزة",cod:"الدفع عند الاستلام متاح",items:"قطعة",viewCart:"عرض السلة",yourCart:"سلة المشتريات",checkout:"إتمام الطلب — الدفع عند الاستلام",name:"الاسم الكامل",phone:"رقم الهاتف",address:"عنوان التوصيل",city:"المدينة / الدولة",confirm:"تأكيد الطلب",empty:"السلة فارغة.",added:"تمت الإضافة إلى السلة",complete:"يرجى إكمال بيانات التوصيل",login:"تسجيل الدخول",register:"إنشاء حساب",logout:"تسجيل الخروج",email:"البريد الإلكتروني",password:"كلمة المرور",have:"لديك حساب بالفعل؟",new:"عميل جديد؟",orders:"طلباتي",loginFirst:"سجّل الدخول لإدارة حسابك وطلباتك."}};
function tr(k){return T[lang][k]} function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=tr(e.dataset.ph));document.getElementById('langBtn').textContent=lang==='ar'?'English':'العربية';render(products);renderCart()}
function toggleLang(){lang=lang==='en'?'ar':'en';localStorage.setItem('afnan_lang',lang);apply()}
async function api(url,opt={}){let r=await fetch(url,{credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function init(){let d=await api('/api/products');products=d.products;let a=await api('/api/auth?action=me');me=a.user;apply()}
function money(n){return new Intl.NumberFormat(lang==='ar'?'ar-EG':'en-US').format(n)+' EGP'}
function render(list){document.getElementById('products').innerHTML=list.map(p=>`<article class="card"><img src="${p.image}" alt="${lang==='ar'?(p.nameAr||p.name):p.name}"><div class="card-body"><h3>${lang==='ar'?(p.nameAr||p.name):p.name}</h3><p>${p.category}</p><div class="price">${money(p.price)}</div><button class="gold" onclick="add(${p.id})">${tr('cart')}</button></div></article>`).join('')}
function filter(c){render(c==='All'?products:products.filter(p=>p.category===c))}
function add(id){cart.push(id);localStorage.setItem('afnan_cart',JSON.stringify(cart));updateCount();alert(tr('added'))}
function updateCount(){document.getElementById('count').textContent=cart.length;document.getElementById('bar').textContent=cart.length}
function openCart(){renderCart();document.getElementById('cartModal').style.display='block'} function closeModal(id){document.getElementById(id).style.display='none'}
function renderCart(){let counts={};cart.forEach(id=>counts[id]=(counts[id]||0)+1);let total=0;document.getElementById('cartLines').innerHTML=Object.entries(counts).map(([id,q])=>{let p=products.find(x=>x.id==id),t=p.price*q;total+=t;return `<div class="line"><span>${lang==='ar'?(p.nameAr||p.name):p.name} × ${q}</span><span>${money(t)} <button onclick="removeOne(${id})">−</button></span></div>`}).join('')||`<p>${tr('empty')}</p>`;document.getElementById('total').textContent=(lang==='ar'?'الإجمالي: ':'Total: ')+money(total);updateCount()}
function removeOne(id){let i=cart.indexOf(id);if(i>=0)cart.splice(i,1);localStorage.setItem('afnan_cart',JSON.stringify(cart));renderCart()}
async function placeOrder(){if(!cart.length)return alert(tr('empty'));let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),city=document.getElementById('city').value.trim();if(!name||!phone||!address||!city)return alert(tr('complete'));try{let items=cart.map(id=>{let p=products.find(x=>x.id==id);return {productId:p.id,name:p.name,price:p.price,qty:1}});let d=await api('/api/orders',{method:'POST',body:JSON.stringify({items,customer:{name,phone,address,city}})});cart=[];localStorage.setItem('afnan_cart','[]');updateCount();document.getElementById('result').innerHTML=`<div class="success">${lang==='ar'?'تم تأكيد الطلب. رقم طلبك: ':'Order confirmed. Your order number is '}<b>${d.order.id}</b>.<br>${lang==='ar'?'طريقة الدفع: الدفع عند الاستلام.':'Payment: Cash on Delivery.'}</div>`;renderCart()}catch(e){alert(e.message)}}
function openAccount(){document.getElementById('accountModal').style.display='block';renderAccount()}
function renderAccount(){let el=document.getElementById('account');if(me){el.innerHTML=`<h2>${tr('account')}</h2><p>${me.email}</p><button onclick="logout()">${tr('logout')}</button><h3>${tr('orders')}</h3><div id="myorders">...</div>`;loadOrders()}else{el.innerHTML=`<h2>${tr('account')}</h2><input class="field" id="ae" placeholder="${tr('email')}"><input class="field" id="ap" type="password" placeholder="${tr('password')}"><input class="field" id="an" placeholder="${tr('name')}"><button class="gold" onclick="login()">${tr('login')}</button> <button onclick="register()">${tr('register')}</button>`}}
async function login(){try{let d=await api('/api/auth?action=login',{method:'POST',body:JSON.stringify({email:ae.value,password:ap.value})});me=d.user;renderAccount()}catch(e){alert(e.message)}}
async function register(){try{let d=await api('/api/auth?action=register',{method:'POST',body:JSON.stringify({email:ae.value,password:ap.value,name:an.value})});me=d.user;renderAccount()}catch(e){alert(e.message)}}
async function logout(){await api('/api/auth?action=logout',{method:'POST',body:'{}'});me=null;renderAccount()}
async function loadOrders(){let d=await api('/api/orders');document.getElementById('myorders').innerHTML=d.orders.length?d.orders.map(o=>`<div class="line"><span>${o.id}</span><span>${o.status}</span></div>`).join(''):'<p>—</p>'}
init();
</script></body></html>
